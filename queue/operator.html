<!DOCTYPE html>
<html lang="ru">
<head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%2328a745'/%3E%3Ccircle cx='5' cy='8' r='2' fill='white'/%3E%3Cpath d='M10,4 C12,6 12,10 10,12' stroke='white' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<meta charset="UTF-8">
<title>Рабочее место сотрудника</title>
    <link rel="stylesheet" href="/queue/css/base.css">
    <link rel="stylesheet" href="/queue/css/operator.css">
</head>

<body class="operator-page">

<div id="toast-notification" style="display:none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--danger); color: white; padding: 15px 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 1000; font-weight: 600;">
    Закончите с текущим клиентом!
</div>

<div id="app-update-notification" class="app-update-notification" style="display:none;">
    Доступно обновление, пожалуйста перезапустите страницу (ctrl + F5)
</div>

<header class="header-panel">
    <div class="button-group">
        <button id="btn-start" class="btn-success" onclick="changeWindowStatus('online')">ОНЛАЙН</button>
        <button id="btn-stop" class="btn-outline" onclick="changeWindowStatus('break')">ПЕРЕРЫВ</button>
		
		<div id="status-info-block" class="info-status" style="margin: 0; padding: 6px 14px; background: #f1f5f9; border-radius: 20px; font-size: 0.95rem;">
			<div id="status-dot" class="dot"></div>
			<span id="status-text" style="font-weight: 700;">Загрузка...</span>
		</div>

    </div>
    
    <div class="button-group header-actions">
        <div class="operator-settings">
            <button
                id="operator-settings-toggle"
                class="btn-outline icon-button operator-settings-toggle"
                type="button"
                onclick="toggleOperatorSettingsPopup()"
                aria-expanded="false"
                aria-controls="operator-settings-popup"
                title="Настройки"
            >
                <img src="icons/settings.svg" alt="" class="button-icon">
                <span>НАСТРОЙКИ</span>
            </button>

            <div id="operator-settings-popup" class="operator-settings-popup" role="dialog" aria-label="Настройки оператора">
                <div class="operator-settings-header">
                    <strong>Настройки</strong>
                    <button class="operator-settings-close" type="button" onclick="closeOperatorSettingsPopup()" aria-label="Закрыть">×</button>
                </div>

                <div class="operator-settings-list">

                    <div class="operator-settings-row">
                        <div>
                            <strong>Звук</strong>
                            <span>Звуковые оповещения при новом талоне</span>
                        </div>
                        <button
                            id="new-ticket-sound-toggle"
                            class="btn-outline icon-button sound-toggle-button"
                            type="button"
                            onclick="toggleNewTicketSound()"
                            title="Звук при новом тикете"
                        >
                            <img
                                id="new-ticket-sound-icon"
                                src="icons/volume-on.svg"
                                alt=""
                                class="button-icon"
                            >
                        </button>
                    </div>

                    <div class="operator-settings-row">
                        <div>
                            <strong>Уведомления</strong>
                            <span>Системные оповещения при новом талоне</span>
                        </div>
                        <button
                            id="new-ticket-notification-toggle"
                            class="btn-outline icon-button notification-toggle-button"
                            type="button"
                            onclick="toggleNewTicketSystemNotification()"
                            title="Системные уведомления при новом тикете"
                        >
                            <img
                                id="new-ticket-notification-icon"
                                src="icons/notification-off.svg"
                                alt=""
                                class="button-icon"
                            >
                        </button>
						

                    </div>

                    <button class="btn-outline operator-settings-wide-button" type="button" onclick="openOperatorChangelogHistory()">ОБНОВЛЕНИЯ</button>
                </div>
            </div>
        </div>
        <button class="btn-outline icon-button" onclick="logout()">
            <img src="icons/logout.svg" alt="" class="button-icon">
            <span>ВЫЙТИ</span>
        </button>
    </div>
</header>

<main class="main-layout">
	<section class="glass-card operator-queue-panel" style="display:flex; flex-direction:column; overflow:hidden;">
		<div class="queue-columns" id="queue-columns">
			<button class="queue-column active" type="button" data-section="waiting" onclick="selectQueueSection('waiting')">
				<span>Ожидающие</span>
				<strong id="queue-count-waiting">0</strong>
			</button>
			<button class="queue-column" type="button" data-section="deferred" onclick="selectQueueSection('deferred')">
				<span>Отложенные</span>
				<strong id="queue-count-deferred">0</strong>
			</button>
			<button class="queue-column" type="button" data-section="cancelled" onclick="selectQueueSection('cancelled')">
				<span>Отменённые</span>
				<strong id="queue-count-cancelled">0</strong>
			</button>
			<button class="queue-column" type="button" data-section="served" onclick="selectQueueSection('served')">
				<span>Обслуженные</span>
				<strong id="queue-count-served">0</strong>
			</button>
		</div>
		<div id="queue-list" class="queue-list" style="flex:1; overflow-y:auto; min-height:0;">Загрузка...</div>
		<!---<div style="flex-shrink:0; padding-top:16px; border-top:1px solid #e2e8f0;">
			<span style="font-size:0.95rem; text-transform:uppercase; font-weight:800; color:var(--text-main); letter-spacing:0.5px;">Обслужено сегодня:</span>
			<span id="served-today-count" style="font-size:1.8rem; font-weight:700; color:var(--primary); margin-left:10px;">—</span>
		</div>--->
	</section>

    <section class="glass-card display-zone">
        <div class="current-client-panel">
            <div class="ticket-label">ТЕКУЩИЙ КЛИЕНТ</div>
            <div id="current" class="ticket-number">--</div>
		    <div id="current-service" class="current-service">—</div>
        </div>
        
			
	<div class="button-group primary-actions">
		<button id="next-btn" class="btn-primary" onclick="callNext()">ВЫЗВАТЬ КЛИЕНТА</button>
		<button class="btn-danger" onclick="finishCurrent()">ЗАВЕРШИТЬ</button>
	</div>

	<div class="button-group secondary-actions secondary-critical-actions">
		<button class="btn-outline" id="defer-ticket-btn" onclick="showDeferReasonPopup()">ОТЛОЖИТЬ</button>
		<button class="btn-outline" id="cancel-btn" onclick="cancelCurrent()">ОТМЕНИТЬ</button>
	</div>

	<div class="button-group secondary-actions tertiary-actions">
		<button class="btn-outline" id="recall-btn" onclick="recallCurrent()">ПОВТОРИТЬ ВЫЗОВ</button>
		<button class="btn-outline" type="button" onclick="promptCallByNumber()">ВЫЗВАТЬ ПО НОМЕРУ</button>
		<button class="btn-outline" id="redirect-btn" onclick="showRedirectModal()">ПЕРЕНАПРАВИТЬ</button>
		<!---<div class="operator-more-actions">
			<button class="btn-outline" type="button" onclick="toggleOperatorMoreMenu()">⋯ ДОПОЛНИТЕЛЬНО</button>
			<div id="operator-more-menu" class="operator-more-menu">

			</div>
		</div> --->
	</div>

    <div class="auto-call-info-block" aria-live="polite">
        <strong>Автовызов</strong>
        <span id="auto-call-status" class="auto-call-status-text">Загрузка...</span>
        <small id="auto-call-hint" class="auto-call-hint"></small>
    </div>

    </section>

	<section class="glass-card">
		<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; height: 32px;">
			<h3 style="margin: 0; padding: 0; line-height: 1;">Информация</h3>
		</div>

		<div id="operator-info" style="line-height: 1.6;"></div>
	</section>
</main>

<script src="/queue/js/config.js"></script>
<script src="/queue/js/operator-queue-sections.js"></script>
<script src="/queue/js/operator.js"></script>
<script src="/queue/js/operator-changelog.js"></script>

</body>
</html>
